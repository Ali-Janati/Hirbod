# Apache — دسترسی به هیربد در /var/www/html/hirbad
# URL: http://192.168.100.25/hirbad/

<Directory /var/www/html/hirbad>
    Options -Indexes +FollowSymLinks
    AllowOverride None
    Require all granted
</Directory>

# جلوگیری از دسترسی HTTP به پوشه config (symlink)
<Directory /var/www/hirbad-config>
    Require all denied
</Directory>
